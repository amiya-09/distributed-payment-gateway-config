server:
  port: 8080

apps:
  security:
    trust-inbound-headers: false
    public-routes:
      - "/v1/auth/**"
      - "/webhook/**"

  rate-limit:
    method: fixed
    use-case:
      api-key:
        requests-per-minute: 200

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: merchant-service
              uri: lb://merchant-service
              predicates:
                - Path=/v1/auth/**, /v1/merchant/**

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/v1/orders/**, /v1/payments/**

            - id: vault-service
              uri: lb://vaulr-service
              predicates:
                - Path=/v1/vaulr/**

            - id: operations-service
              uri: lb://operations-service
              predicates:
                - Path=/v1/webhook/**
